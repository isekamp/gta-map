<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GTA Map">
<meta name="theme-color" content="#f6f4ee">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>نقشه جاهای دیدنی لس سانتوس</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen app — schematic island map + side panel (stacks under the map on phones) */
:root{
  --water:#cfe0e3; --water-line:#b7cdd1;
  --land:#ece6d6; --shore:#a99f86; --lake:#bcd6da;
  --bg:#f6f4ee; --panel:#fffdf8; --fg:#24221c; --muted:#6f6a5c; --line:#e1dccd;
  --accent:#c2542d;
  --c-view:#2f7d5b; --c-landmark:#2c5d9e; --c-secret:#8a4bb0; --c-water:#16838f;
  --font-ui:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --water:#122126; --water-line:#1b3036; --land:#2a2a24; --shore:#5d5644; --lake:#18303a;
  --bg:#121412; --panel:#1a1c19; --fg:#ebe7dc; --muted:#a29d8d; --line:#2f312b;
  --accent:#e27a50; --c-view:#5fbf8f; --c-landmark:#6f9fe0; --c-secret:#bb8ade; --c-water:#4fc3cf; color-scheme:dark}}
:root[data-theme="dark"]{
  --water:#122126; --water-line:#1b3036; --land:#2a2a24; --shore:#5d5644; --lake:#18303a;
  --bg:#121412; --panel:#1a1c19; --fg:#ebe7dc; --muted:#a29d8d; --line:#2f312b;
  --accent:#e27a50; --c-view:#5fbf8f; --c-landmark:#6f9fe0; --c-secret:#bb8ade; --c-water:#4fc3cf; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.15rem;font-weight:800;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.8rem}
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 330px;gap:12px}
#map{border-radius:10px;border:1px solid var(--line);background:#1d4c8a;min-height:0}
aside{min-height:0;min-width:0;display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto}
@media (max-width:760px){
  .main{grid-template-columns:1fr;grid-template-rows:58% 1fr}
}
.label{font-size:.72rem;color:var(--muted);letter-spacing:.02em;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.8rem;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="false"]{opacity:.45}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.list li button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);cursor:pointer}
ul.list li button:hover,ul.list li button:focus-visible{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.name{font-weight:600;font-size:.86rem;min-width:0}
.coord{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
form{display:grid;grid-template-columns:1fr 1fr;gap:6px}
form input,form select{font:inherit;font-size:.82rem;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);min-width:0}
form input.num{font-family:var(--font-mono);direction:ltr;text-align:left}
form .wide{grid-column:1/-1}
.btn{font:inherit;font-size:.82rem;font-weight:600;border:0;border-radius:6px;padding:7px 10px;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.note{font-size:.74rem;color:var(--muted);line-height:1.7}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#readout{font-family:var(--font-mono);font-size:.75rem;direction:ltr;color:var(--muted);font-variant-numeric:tabular-nums}

/* --- Leaflet essentials (inlined) --- */
.leaflet-pane,.leaflet-marker-icon,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:var(--font-ui);touch-action:none}
.leaflet-pane{z-index:400}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane svg{z-index:200}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-image-layer{position:absolute;left:0;top:0;pointer-events:none}
.leaflet-container img.leaflet-image-layer,.leaflet-container .leaflet-marker-pane img{max-width:none!important;max-height:none!important}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-marker-icon,.leaflet-pane>svg path{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto;cursor:pointer}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}
.leaflet-bar{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.leaflet-bar a{display:block;width:32px;height:32px;line-height:32px;text-align:center;text-decoration:none;color:var(--fg);font-size:18px;font-weight:600}
.leaflet-bar a+a{border-top:1px solid var(--line)}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:18px}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;text-align:right;direction:rtl;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.leaflet-popup-content{margin:12px 14px;line-height:1.7;min-width:190px}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:14px;height:14px;margin:-8px auto 0;transform:rotate(45deg);background:var(--panel);border:1px solid var(--line)}
.leaflet-popup-close-button{position:absolute;top:4px;left:6px;color:var(--muted);text-decoration:none;font-size:18px}
.leaflet-tooltip{position:absolute;pointer-events:none;white-space:nowrap}

/* map styling */
.land{fill:var(--land);fill-opacity:1;stroke:var(--shore);stroke-width:1.5}
.lake{fill:var(--lake);fill-opacity:1;stroke:var(--shore);stroke-width:1}
.grid{stroke:var(--water-line);stroke-width:1;stroke-dasharray:3 4}
.region{font-family:var(--font-ui);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--shore);font-size:12px;white-space:nowrap;transform:translate(-50%,-50%);position:absolute}
.region.water{color:var(--water-line);font-style:italic;font-weight:600}
.pin{border-radius:50%;border:2px solid var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;font:600 10px var(--font-mono)}
.pin.is-found{opacity:.38;filter:grayscale(.7)}
li.is-found .name{opacity:.5;text-decoration:line-through}
li.is-found .dot{opacity:.4}
.tick{font-size:.72rem;color:var(--c-view);white-space:nowrap}
.found-btn{margin-top:8px;width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:.8rem;padding:6px 4px;border:0;background:transparent;color:var(--fg);cursor:pointer}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.progress{font-size:.78rem;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.pop-title{font-weight:800;font-size:.95rem}
.pop-meta{font-size:.78rem;color:var(--muted)}
.pop-row{display:flex;gap:8px;font-size:.8rem;margin-top:6px;align-items:baseline}
.pop-k{font-size:.7rem;font-weight:700;color:#fff;background:var(--c-secret);border-radius:4px;padding:1px 6px;flex:none}
.pop-info{font-size:.8rem;margin:6px 0 0;max-width:260px;white-space:normal;line-height:1.75}
.when{font-size:.7rem;color:var(--c-secret);border:1px solid currentColor;border-radius:999px;padding:0 6px}
.leaflet-popup-content{min-width:220px}
@media (prefers-reduced-motion:reduce){.leaflet-zoom-anim .leaflet-zoom-animated{transition:none}}
</style>
</head>
<body>


<div class="app">
  <header>
    <h1>جاهای دیدنی GTA V</h1>
    <span class="sub" id="sub"></span>
  </header>
  <div class="main">
    <div id="map" dir="ltr" aria-label="نقشه"></div>
    <aside>
      <div>
        <div class="label">دسته‌ها</div>
        <div class="chips" id="chips"></div>
      </div>
      <div>
        <div class="label">وضعیت</div>
        <div class="seg" role="group" aria-label="وضعیت پیدا شدن">
          <button type="button" data-f="all" aria-pressed="true">همه</button>
          <button type="button" data-f="notfound" aria-pressed="false">پیدا نشده</button>
          <button type="button" data-f="found" aria-pressed="false">پیدا شده</button>
        </div>
        <div class="progress" id="progress"></div>
      </div>
      <p class="note">مختصات از فهرست‌های جامعه‌ی بازیکن‌ها و راهنماهای GTA V جمع شده‌اند. مکان‌هایی که «تقریبی» دارند مختصات دقیق منتشرشده ندارند.</p>
    </aside>
  </div>
</div>

  {id:"p_lsia",cat:"landmark",name:"فرودگاه LSIA",x:-1102,y:-2895,
   info:"فرودگاه بین‌المللی Los Santos."},
  {id:"s10",cat:"landmark",name:"فرودگاه Sandy Shores",x:1741,y:3269,
   info:"باند کوچک خاکی که پایگاه کار Trevor است."},
  {id:"p_prison",cat:"landmark",name:"زندان Bolingbroke",x:1679,y:2514,
   info:"زندان با دیوار دایره‌ای؛ با ورود به داخل محوطه تحت تعقیب پلیس قرار می‌گیرید."},
  {id:"p_humane",cat:"landmark",name:"Humane Labs",x:3617,y:3740,
   info:"آزمایشگاه تحقیقاتی ساحل شرقی، صحنه‌ی یکی از سرقت‌های بازی. تونل‌های زیرآبی دارد."},
  {id:"s12",cat:"landmark",name:"بانک Paleto Bay",x:-104,y:6469,
   info:"بانک شهر کوچک Paleto Bay، صحنه‌ی سرقت Paleto Score."},
  // --- beach / underwater ---
  {id:"s9",cat:"water",name:"یوفوی زیر آب",x:762,y:7390,approx:true,
   info:"یک یوفوی پوشیده از جلبک در کف اقیانوس، شمال‌شرق Paleto Bay. با زیردریایی یا وسایل غواصی قابل دسترسی است و به تکمیل ۱۰۰٪ نیاز ندارد."},
  {id:"p_reef",cat:"water",name:"صخره‌ی مرجانی شمال",x:107,y:7282,
   info:"آب‌های کم‌عمق دورترین ساحل شمالی با مرجان؛ مناسب غواصی."},
  {id:"p_island",cat:"water",name:"جزیره‌ی کوچک شمال",x:18,y:7630,
   info:"دورترین تکه خشکی شمال نقشه، با ساحل و گل."},
  {id:"p_vespucci",cat:"water",name:"ساحل Vespucci",x:-1350,y:-1550,approx:true,time:"غروب",short:"غروب",
   info:"ساحل شلوغ الهام‌گرفته از Venice Beach، پر از عابر و ورزشکار."}
];

const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ll=(x,y)=>L.latLng(y,x);
const fmt=n=>Math.round(n).toLocaleString("en-US");

const active=new Set(Object.keys(CATS));

// CRS adapted from RiceaRaul/gta-v-map-leaflet (MIT): game X/Y -> map space
const GTA_CRS=Object.assign({},L.CRS.Simple,{
  projection:L.Projection.LonLat,
  scale:z=>Math.pow(2,z), zoom:s=>Math.log(s)/Math.LN2,
  distance:(a,b)=>Math.hypot(b.lng-a.lng,b.lat-a.lat),
  transformation:new L.Transformation(0.02072,117.3,-0.0205,172.8),
  infinite:true
});
const map=L.map("map",{crs:GTA_CRS,minZoom:0,maxZoom:5,zoomSnap:.25,attributionControl:false,
  maxBounds:L.latLngBounds(ll(-6000,-6000),ll(6500,9500))});

// satellite image: the full square covers the CRS zoom-0 tile (256px),
// i.e. game X -5661…6694 and Y -4059…8429
L.imageOverlay(MAP_IMG,L.latLngBounds(ll(-5661,-4059),ll(6694,8429)),{interactive:false}).addTo(map);
map.fitBounds(L.latLngBounds(ll(-3400,-3900),ll(4100,7500)));
// --- found state: kept per person in the page's db, with browser storage as fallback ---
let found=new Set();
try{found=new Set(JSON.parse(localStorage.getItem("gta-found")||"[]"))}catch(e){}
let foundRef=null;
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const uid=user?await user.id():null;
    if(!db||!uid)return;
    foundRef=db.doc("data/users/"+uid+"/found");
    const snap=await foundRef.get();
    if(snap.exists){found=new Set((snap.data().ids)||[]);try{localStorage.setItem("gta-found",JSON.stringify([...found]))}catch(e){}render()}
    else if(found.size){foundRef.set({ids:[...found]}).catch(()=>{})}
  }catch(e){}
})();
function persistFound(){
  try{localStorage.setItem("gta-found",JSON.stringify([...found]))}catch(e){}
  if(foundRef)foundRef.set({ids:[...found]}).catch(()=>{});
}
let foundFilter="all";
const layer=L.layerGroup().addTo(map);
const markers={};
function all(){return PLACES}
function popupFor(p){
  const el=document.createElement("div");
  const isF=found.has(p.id);
  el.innerHTML=`<div class="pop-title">${esc(p.name)}</div>
    <div class="pop-meta">${CATS[p.cat].fa}${p.approx?" · مکان تقریبی":""}</div>
    ${p.time?`<div class="pop-row"><span class="pop-k">زمان</span><span>${esc(p.time)}</span></div>`:""}
    ${p.info?`<p class="pop-info">${esc(p.info)}</p>`:""}
    <button type="button" class="btn found-btn${isF?" ghost":""}">${isF?"Mark as not found":"Mark as found"}</button>`;
  el.querySelector(".found-btn").onclick=()=>{
    found.has(p.id)?found.delete(p.id):found.add(p.id);persistFound();
    map.closePopup();render();
  };
  return el;
}
function render(){
  layer.clearLayers();
  const list=document.getElementById("list");if(list)list.innerHTML="";
  const inCat=all().filter(p=>active.has(p.cat));
  const pts=inCat.filter(p=>foundFilter==="all"||(foundFilter==="found")===found.has(p.id))
    .sort((a,b)=>(found.has(a.id)-found.has(b.id))||(Object.keys(CATS).indexOf(a.cat)-Object.keys(CATS).indexOf(b.cat)));
  
  const fc=all().filter(p=>found.has(p.id)).length;
  document.getElementById("progress").textContent=`${fc.toLocaleString("fa-IR")} از ${all().length.toLocaleString("fa-IR")} پیدا شده`;
  pts.forEach(p=>{
    const isF=found.has(p.id);
    const size=p.time?24:20;
    const m=L.marker(ll(p.x,p.y),{title:p.name,icon:L.divIcon({className:"",iconSize:[size,size],iconAnchor:[size/2,size/2],
      html:`<div class="pin${isF?" is-found":""}" style="width:${size}px;height:${size}px;background:${css(CATS[p.cat].color)}">${isF?"✓":""}</div>`})});
    m.bindPopup(()=>popupFor(p));
    m.addTo(layer);markers[p.id]=m;
    const li=document.createElement("li");
    if(isF)li.className="is-found";
    li.innerHTML=`<button type="button"><span class="dot" style="background:${css(CATS[p.cat].color)}"></span><span class="name">${esc(p.name)}</span><span class="tick">${isF?"✓ پیدا شده":(p.time?`<span class="when">${esc(p.short||"زمان خاص")}</span>`:"")}</span></button>`;
    li.firstChild.onclick=()=>{map.flyTo(ll(p.x,p.y),3.5,{duration:.6});setTimeout(()=>m.openPopup(),650)};
    if(list)list.appendChild(li);
  });
}
document.getElementById("sub").textContent=`${PLACES.length.toLocaleString("fa-IR")} مکان در ${Object.keys(CATS).length.toLocaleString("fa-IR")} دسته`;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

// category chips
const chips=document.getElementById("chips");
Object.entries(CATS).forEach(([k,c])=>{
  const b=document.createElement("button");b.type="button";b.className="chip";b.setAttribute("aria-pressed","true");
  b.innerHTML=`<span class="dot" style="background:${css(c.color)}"></span>${c.fa}`;
  b.onclick=()=>{active.has(k)?active.delete(k):active.add(k);b.setAttribute("aria-pressed",active.has(k));render()};
  chips.appendChild(b);
});
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
  foundFilter=b.dataset.f;
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  render();
});
render();
</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}</script>
</body>
</html>
